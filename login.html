<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,
       initial-scale=1.0"
    />
    <title>Instagram</title>
    <link rel="stylesheet" href="/STYLES/right.css" />
    <link rel="stylesheet" href="/STYLES/left.css" />
    <link rel="stylesheet" href="STYLES/container.css" />
    <link rel="stylesheet" href="/STYLES/footer.css" />
  </head>
  <body>
    <div>
      <div class="line-container">
        <div class="container">
          <div class="left-side">
            <img
              class="instagram-logo desctop-logo"
              src="/IMAGES/instagram.jpeg"
              alt="instagram logo"
            />
            <div class="instagram-text">
              <p>
                See everyday moments from your

                <span class="domain-text">close friends</span> .
              </p>
            </div>
            <div class="instalog-images">
              <img src="/IMAGES/instalog.webp" alt="instagram images" />
            </div>
          </div>

          <div class="right-side">
            <div class="logo-container">
              <img
                class="instagram-logo mobile-logo"
                src="/IMAGES/instagram.jpeg"
                alt="instagram logo"
              />
            </div>
            <p class="login-text">Log into instagram</p>
            <div class="email">
              <input type="text" id="email" placeholder=" " required />
              <label for="email"> Mobile number, username or email</label>
            </div>
            <div class="email">
              <input type="text" id="password" placeholder=" " required />
              <label for="password">password</label>
            </div>
            <button class="login-button">Log in</button>
            <button class="forgotten-password">Forgot password?</button>
            <button class="logo-button">
              <div class="facebook-logo">
                <img src="/IMAGES/facebook.svg" alt="facebook logo" />
                <a
                  href="http://www.facebook.com/"
                  target="_blank"
                  rel="noopener noreferrer"
                  >Log in with Facebook</a
                >
              </div>
            </button>
            <button class="new-account">Create new account</button>
            <div class="meta-content">
              <span class="meta-symbol">∞</span> Meta
            </div>
          </div>
        </div>
      </div>
    </div>
    <footer class="instagram-footer">
      <div class="footer-links">
        <a href="#">Meta</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">Jobs</a>
        <a href="#">Help</a>
        <a href="#">API</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Locations</a>
        <a href="#">Instagram Lite</a>
        <a href="#">Meta AI</a>
        <a href="#">Threads</a>
        <a href="#">Contact Uploading & Non-Users</a>
        <a href="#">Meta Verified</a>
      </div>

      <div class="footer-bottom">
        <select aria-label="Language">
          <option>English</option>
          <option>English (UK)</option>
        </select>

        <span>© 2026 Instagram from Meta</span>
      </div>
    </footer>
  </body>
</html>
